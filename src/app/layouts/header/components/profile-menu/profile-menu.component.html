<details #profileMenu class="dropdown dropdown-end" [open]="isOpen()">
  <summary
    class="btn grid size-10 place-items-center rounded-full bg-primary/10 text-primary"
    (click)="toggleOpen()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      class="size-5"
    >
      <path d="M20 21a8 8 0 0 0-16 0" />
      <circle cx="12" cy="7" r="4" />
    </svg>
  </summary>
  <div class="menu dropdown-content bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
    <ul>
      <li class="menu-title">
        <span>Мій профіль</span>
      </li>
      <li>
        <a routerLink="/wishlists" (click)="isOpen.set(false)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            class="size-5"
          >
            <rect x="3" y="5" width="18" height="16" rx="2" />

            <path d="M8 3v4M16 3v4M3 10h18" />
          </svg>

          Мої вішлісти
        </a>
      </li>
      <li>
        <a routerLink="/reserved-gifts" (click)="isOpen.set(false)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            class="size-5"
          >
            <!-- gift icon -->
            <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" />
            <path d="M12 12v8M2 12h20l-2-8H4l-2 8z" />
          </svg>

          Мої резервування
        </a>
      </li>

      <div class="divider my-1"></div>

      <li>
        <button type="button" class="text-error" (click)="logout.emit()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            class="size-5"
          >
            <path d="M10 17l5-5-5-5M15 12H3" />
            <path d="M14 4h4a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-4" />
          </svg>

          Вийти
        </button>
      </li>
    </ul>
  </div>
</details>
