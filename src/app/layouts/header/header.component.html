<header class="sticky top-0 z-30 border-b border-base-300/60 bg-base-100/95 backdrop-blur">
  <div class="navbar mx-auto min-h-16 w-full max-w-360 px-4 sm:px-6 lg:px-8">
    <!-- Logo -->
    <div class="navbar-start">
      <a routerLink="/" class="flex items-center gap-2">
        <img alt="" class="size-9 object-contain" />

        <span class="text-xl font-bold tracking-tight sm:text-2xl"> PurrList </span>
      </a>
    </div>

    <!-- Desktop navigation -->
    <nav class="navbar-center hidden lg:flex" aria-label="Головна навігація">
      <ul class="menu menu-horizontal gap-1 px-1">
        <li>
          <a href="#how-it-works">Як це працює</a>
        </li>

        <li>
          <a href="#benefits">Переваги</a>
        </li>

        <li>
          <button type="button" class="btn btn-ghost">Modal test</button>
        </li>

        <li>
          <a [routerLink]="['/wishlists']"> Приклад вішліста (НЕ ГОТОВО) </a>
        </li>
      </ul>
    </nav>

    <!-- Actions -->
    <div class="navbar-end gap-2">
      <!-- Auth status -->
      <div
        class="size-2.5 shrink-0 rounded-full"
        [class.bg-success]="authStore.isAuthenticated()"
        [class.bg-error]="authStore.isUnauthenticated()"
        [class.bg-warning]="authStore.isLoading()"
        aria-hidden="true"
      ></div>

      <!-- Create wishlist -->
      <a
        [routerLink]="['/']"
        [queryParams]="utilsService.buildFlowQueryParams(utilsService.ModalFlowKey.NEW_WISHLIST)"
        class="btn btn-primary hidden lg:inline-flex"
      >
        Створити вішліст
      </a>

      <!-- Profile dropdown -->
      @if (authStore.isAuthenticated()) {
        <app-profile-menu (logout)="logout()" />
      }

      <!-- Mobile menu -->
      <details class="dropdown dropdown-end lg:hidden">
        <summary class="btn btn-square btn-ghost list-none" aria-label="Відкрити меню">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="size-6"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 6h16" />
            <path d="M4 12h16" />
            <path d="M4 18h16" />
          </svg>
        </summary>

        <ul
          class="menu dropdown-content z-40 mt-2 w-64 rounded-box border border-base-300 bg-base-100 p-3 shadow-xl"
        >
          <li>
            <a href="#how-it-works">Як це працює</a>
          </li>

          <li>
            <a href="#benefits">Переваги</a>
          </li>

          <li>
            <a [routerLink]="['/wishlists']"> Приклад вішліста </a>
          </li>

          <li class="mt-2">
            <a
              [routerLink]="['/']"
              [queryParams]="
                utilsService.buildFlowQueryParams(utilsService.ModalFlowKey.NEW_WISHLIST)
              "
              class="btn btn-primary"
            >
              Створити вішліст
            </a>
          </li>
        </ul>
      </details>
    </div>
  </div>
</header>
<app-modal></app-modal>
