<details #wishlistMenu class="dropdown dropdown-end" [open]="isOpen()">
  <summary class="btn btn-circle btn-ghost btn-xs lg:btn-sm" (click)="toggleOpen()">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
      class="size-5"
      aria-hidden="true"
    >
      <circle cx="5" cy="12" r="1.7" />
      <circle cx="12" cy="12" r="1.7" />
      <circle cx="19" cy="12" r="1.7" />
    </svg>
  </summary>

  <div class="menu dropdown-content bg-base-100 rounded-box z-1 w-48 p-2 shadow-sm">
    <ul>
      <li>
        <a
          [routerLink]="['/wishlists', wishlist().id]"
          (click)="isOpen.set(false)"
          [attr.disabled]="isDeleting() ? true : null"
        >
          Переглянути
        </a>
      </li>

      <li>
        <button
          type="button"
          (click)="edit.emit(wishlist().id); isOpen.set(false)"
          [disabled]="isDeleting()"
        >
          Редагувати
        </button>
      </li>

      <li>
        <button
          type="button"
          class="text-error"
          (click)="delete.emit(wishlist().id)"
          [disabled]="isDeleting()"
        >
          @if (isDeleting()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          Видалити
        </button>
      </li>
    </ul>
  </div>
</details>
