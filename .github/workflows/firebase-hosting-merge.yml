# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install pnpm FIRST
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10 # Specify your v9 or v10 version

      # 2. Setup Node SECOND (and inject pnpm caching)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        env:
          NG_APP_SUPABASE_API_URL: ${{secrets.SUPABASE_API_URL}}
          NG_APP_SUPABASE_PUBLISHABLE_KEY: ${{secrets.SUPABASE_PUBLISHABLE_KEY}}
          NG_APP_SITE_URL: ${{secrets.SITE_URL}}
        run: pnpm run build --configuration=production
        
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEOWLIST_1F157 }}
          channelId: live
          projectId: meowlist-1f157
